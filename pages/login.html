<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập – EngPro</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#002045', 'primary-container': '#1a365d',
            secondary: '#0061a5', accent: '#e07b28',
            surface: '#f7fafc', 'surface-low': '#f1f4f6',
            'on-surface': '#181c1e', 'on-surface-variant': '#43474e',
            outline: '#74777f', 'outline-variant': '#c4c6cf',
            error: '#ba1a1a',
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] },
        },
      },
    };
  </script>
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-surface min-h-screen flex flex-col">

  <!-- Top bar -->
  <div class="w-full px-6 py-4">
    <a href="../index.html" class="flex items-center gap-2 w-fit">
      <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center">
        <span class="material-symbols-outlined text-white text-lg">school</span>
      </div>
      <span class="text-lg font-bold text-primary">EngPro</span>
    </a>
  </div>

  <!-- Main -->
  <main class="flex-grow flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md">

      <!-- Card -->
      <div class="bg-white rounded-2xl border border-outline-variant/40 shadow-sm p-8">

        <div class="text-center mb-7">
          <h1 class="text-2xl font-bold text-primary" id="login-title">Chào mừng trở lại</h1>
          <p class="text-sm text-on-surface-variant mt-1" id="login-subtitle">Đăng nhập để tiếp tục học tập</p>
        </div>

        <!-- Error alert -->
        <div id="error-alert" class="hidden mb-5 bg-red-50 border border-red-200 rounded-xl px-4 py-3 flex items-center gap-2">
          <span class="material-symbols-outlined text-error text-sm">error</span>
          <p class="text-xs text-error font-medium" id="error-msg">Email hoặc mật khẩu không đúng.</p>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5">

          <!-- Email -->
          <div>
            <label class="block text-xs font-semibold text-on-surface mb-1.5 uppercase tracking-wider">Email</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-lg">mail</span>
              <input id="email" type="email" placeholder="email@example.com" required
                class="w-full pl-10 pr-4 py-3 text-sm border border-outline-variant rounded-xl focus:border-secondary focus:ring-2 focus:ring-secondary/20 outline-none transition-all bg-white" />
            </div>
          </div>

          <!-- Password -->
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label class="text-xs font-semibold text-on-surface uppercase tracking-wider">Mật khẩu</label>
              <a href="forgot-password.html" id="forgot-link" class="text-xs text-secondary hover:underline">Quên mật khẩu?</a>
            </div>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-lg">lock</span>
              <input id="password" type="password" placeholder="Nhập mật khẩu" required
                class="w-full pl-10 pr-12 py-3 text-sm border border-outline-variant rounded-xl focus:border-secondary focus:ring-2 focus:ring-secondary/20 outline-none transition-all bg-white" />
              <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors">
                <span class="material-symbols-outlined text-lg" id="eye-icon">visibility</span>
              </button>
            </div>
          </div>

          <!-- Submit -->
          <button type="submit" id="submit-btn"
            class="w-full bg-primary text-white font-semibold py-3 rounded-xl hover:opacity-90 transition-opacity text-sm flex items-center justify-center gap-2 mt-2">
            <span class="material-symbols-outlined text-base">login</span>
            Đăng nhập
          </button>

        </form>

        <!-- Bước 2: xác thực 2 lớp -->
        <form id="twofa-form" onsubmit="handleTwofa(event)" class="hidden space-y-5">
          <div class="flex justify-center">
            <span class="w-14 h-14 rounded-full bg-blue-50 text-secondary flex items-center justify-center">
              <span class="material-symbols-outlined text-3xl">verified_user</span>
            </span>
          </div>
          <div>
            <label for="twofa-code" id="twofa-label" class="block text-xs font-semibold text-on-surface mb-1.5 uppercase tracking-wider">Mã xác thực</label>
            <input id="twofa-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456" required
              class="w-full px-4 py-3 text-center text-xl tracking-[0.4em] font-mono border border-outline-variant rounded-xl focus:border-secondary focus:ring-2 focus:ring-secondary/20 outline-none transition-all bg-white" />
            <p class="text-xs text-on-surface-variant mt-2" id="twofa-hint">Mở ứng dụng Authenticator trên điện thoại và nhập mã 6 số của EngPro.</p>
          </div>
          <button type="submit" id="twofa-btn"
            class="w-full bg-primary text-white font-semibold py-3 rounded-xl hover:opacity-90 transition-opacity text-sm flex items-center justify-center gap-2">
            Xác nhận
          </button>
          <div class="flex items-center justify-between text-xs">
            <button type="button" onclick="backToPassword()" class="flex items-center gap-1 text-on-surface-variant hover:text-on-surface">
              <span class="material-symbols-outlined text-sm">arrow_back</span> Quay lại
            </button>
            <button type="button" id="twofa-switch" onclick="toggleRecoveryMode()" class="text-secondary font-semibold hover:underline">Dùng mã dự phòng</button>
          </div>
        </form>

        <p class="text-center text-xs text-on-surface-variant mt-6" id="register-link">
          Chưa có tài khoản?
          <a href="register.html" class="text-secondary font-semibold hover:underline">Đăng ký ngay</a>
        </p>
      </div>


    </div>
  </main>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const email    = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;

      // Loading state
      const btn = document.getElementById('submit-btn');
      btn.innerHTML = '<span class="material-symbols-outlined text-base animate-spin">sync</span> Đang đăng nhập...';
      btn.disabled = true;
      hideError();

      try {
        const res  = await fetch('/api/auth/login', {
          method:      'POST',
          headers:     { 'Content-Type': 'application/json' },
          credentials: 'include',
          body:        JSON.stringify({ email, password }),
        });
        const json = await res.json();

        if (!json.success) {
          showError(json.message || 'Email hoặc mật khẩu không đúng');
          resetBtn();
          return;
        }

        if (json.data.requires_2fa) {
          resetBtn();
          showTwofaStep(true);
          return;
        }
        finishLogin(json.data);

      } catch (err) {
        showError('Không thể kết nối đến máy chủ. Vui lòng kiểm tra mạng rồi thử lại.');
        resetBtn();
      }
    }

    function finishLogin(data) {
      // Lưu thông tin user để UI sử dụng
      sessionStorage.setItem('engpro_user', JSON.stringify(data.user));
      if (data.recovery_codes_left !== undefined) {
        alert(`Bạn vừa dùng một mã dự phòng, còn lại ${data.recovery_codes_left} mã. Có thể tạo lại mã bằng cách tắt rồi bật xác thực 2 lớp trong Cài đặt tài khoản.`);
      }
      // ?next=trang.html: quay lại trang đang dở sau khi đăng nhập (chỉ nhận trang trong thư mục pages)
      const next = new URLSearchParams(location.search).get('next');
      window.location.href = next && /^[a-z0-9-]+\.html(\?[^#]*)?$/i.test(next) ? next : data.redirect;
    }

    // ── Xác thực 2 lớp ─────────────────────────────────────
    let recoveryMode = false;

    function showTwofaStep(show) {
      document.getElementById('login-form').classList.toggle('hidden', show);
      document.getElementById('twofa-form').classList.toggle('hidden', !show);
      document.getElementById('register-link').classList.toggle('hidden', show);
      document.getElementById('login-title').textContent = show ? 'Xác thực 2 lớp' : 'Chào mừng trở lại';
      document.getElementById('login-subtitle').textContent = show
        ? 'Tài khoản của bạn đã bật xác thực 2 lớp'
        : 'Đăng nhập để tiếp tục học tập';
      hideError();
      if (show) {
        setRecoveryMode(false);
        document.getElementById('twofa-code').focus();
      }
    }

    function setRecoveryMode(on) {
      recoveryMode = on;
      const input = document.getElementById('twofa-code');
      input.value = '';
      input.maxLength = on ? 9 : 6;
      input.inputMode = on ? 'text' : 'numeric';
      input.autocomplete = on ? 'off' : 'one-time-code';
      input.placeholder = on ? 'xxxx-xxxx' : '123456';
      document.getElementById('twofa-label').textContent = on ? 'Mã dự phòng' : 'Mã xác thực';
      document.getElementById('twofa-hint').textContent = on
        ? 'Nhập một trong các mã dự phòng bạn đã lưu khi bật xác thực 2 lớp. Mỗi mã chỉ dùng được một lần.'
        : 'Mở ứng dụng Authenticator trên điện thoại và nhập mã 6 số của EngPro.';
      document.getElementById('twofa-switch').textContent = on ? 'Dùng mã 6 số' : 'Dùng mã dự phòng';
    }

    function toggleRecoveryMode() {
      setRecoveryMode(!recoveryMode);
      hideError();
      document.getElementById('twofa-code').focus();
    }

    function backToPassword() {
      showTwofaStep(false);
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
    }

    async function handleTwofa(e) {
      e.preventDefault();
      const input = document.getElementById('twofa-code');
      const code  = input.value.trim();
      if (!recoveryMode && !/^\d{6}$/.test(code)) return showError('Mã xác thực gồm 6 chữ số');

      const btn = document.getElementById('twofa-btn');
      btn.innerHTML = '<span class="material-symbols-outlined text-base animate-spin">sync</span> Đang kiểm tra...';
      btn.disabled = true;
      hideError();
      try {
        const res  = await fetch('/api/auth/login/2fa', {
          method:      'POST',
          headers:     { 'Content-Type': 'application/json' },
          credentials: 'include',
          body:        JSON.stringify({ code }),
        });
        const json = await res.json();
        if (json.success) return finishLogin(json.data);

        if (res.status === 429 || /hết hạn|đăng nhập lại/.test(json.message || '')) {
          backToPassword();
        } else {
          input.value = '';
          input.focus();
        }
        showError(json.message || 'Mã xác thực không đúng');
      } catch {
        showError('Không thể kết nối đến server.');
      }
      btn.innerHTML = 'Xác nhận';
      btn.disabled = false;
    }

    // Điền sẵn email (sau khi đặt lại mật khẩu) và mang email sang trang quên mật khẩu
    (() => {
      const email = new URLSearchParams(location.search).get('email');
      if (email) document.getElementById('email').value = email;
      document.getElementById('forgot-link').addEventListener('click', e => {
        const typed = document.getElementById('email').value.trim();
        if (typed) e.currentTarget.href = 'forgot-password.html?email=' + encodeURIComponent(typed);
      });
    })();

    function showError(msg) {
      document.getElementById('error-msg').textContent = msg;
      document.getElementById('error-alert').classList.remove('hidden');
      const twofa = !document.getElementById('twofa-form').classList.contains('hidden');
      (twofa ? ['twofa-code'] : ['email', 'password'])
        .forEach(id => document.getElementById(id).classList.add('border-error'));
    }

    function hideError() {
      document.getElementById('error-alert').classList.add('hidden');
      ['email', 'password', 'twofa-code'].forEach(id => document.getElementById(id).classList.remove('border-error'));
    }

    function resetBtn() {
      const btn = document.getElementById('submit-btn');
      btn.innerHTML = '<span class="material-symbols-outlined text-base">login</span> Đăng nhập';
      btn.disabled = false;
    }

    function togglePassword() {
      const inp  = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (inp.type === 'password') {
        inp.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        inp.type = 'password';
        icon.textContent = 'visibility';
      }
    }
  </script>
</body>
</html>
